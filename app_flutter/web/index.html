<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="子どもの大切なモノを3Dスキャンして、思い出と一緒にのこすアプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ハコニワ">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ハコニワ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /*
      読み込み中の見た目。Flutter は描画エンジンの用意ができるまで何も描かず、
      そのあいだ真っ白な画面になる（回線が細いと数秒かかる）。
      アプリと同じクリーム色＋ロゴを先に出しておき、最初の描画で消す。
    */
    html, body { margin: 0; height: 100%; background: #FBF6EE; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 45%, #F1E8D9, #E4D9C4);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #4A3728;
      transition: opacity .3s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .logo { font-size: 26px; font-weight: 800; letter-spacing: .08em; }
    #loading .sub { font-size: 12px; color: #8B7355; }
    #loading .bar {
      width: 132px; height: 4px; border-radius: 999px;
      background: #EEE4D3; overflow: hidden;
    }
    #loading .bar span {
      display: block; width: 40%; height: 100%; border-radius: 999px;
      background: #E08A63; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">ハコニワ</div>
    <div class="sub">大切なモノを、思い出と一緒に。</div>
    <div class="bar"><span></span></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter が最初の描画をしたら読み込み中の表示を消す
    new MutationObserver(function (records, observer) {
      if (!document.querySelector('flutter-view')) return;
      observer.disconnect();
      var el = document.getElementById('loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 300);
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
