name: hakoniwa
description: 子どもの大切なモノを3Dスキャンして、家族ごとのハコニワ空間に思い出と一緒にのこすアプリ。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  provider: ^6.1.2

  # 3Dスキャン（多方向キャプチャ）
  camera: ^0.11.0+2
  # 写真をそえる
  image_picker: ^1.1.2
  # こえメモの録音と再生
  record: ^6.0.0
  audioplayers: ^6.1.0

  # 永続化
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # FastAPI バックエンドとの通信
  http: ^1.2.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/room-sample.png

  # 書体は同梱する。実行時に Google Fonts から取る形にすると、
  # そこに届かないネットワークで Flutter Web は文字を1つも描かない。
  # くわしくは assets/fonts/README.md
  fonts:
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenMaruGothic-Black.ttf
          weight: 900
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
